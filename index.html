<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Зубарев смотрит</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg:    var(--tg-theme-bg-color, #17212b);
    --bg2:   var(--tg-theme-secondary-bg-color, #0e1621);
    --text:  var(--tg-theme-text-color, #f5f5f5);
    --hint:  var(--tg-theme-hint-color, #708499);
    --link:  var(--tg-theme-link-color, #6ab3f3);
    --btn:   var(--tg-theme-button-color, #5288c1);
    --btn-t: var(--tg-theme-button-text-color, #ffffff);
    --card:  var(--tg-theme-section-bg-color, #232e3c);
    --accent:var(--tg-theme-accent-text-color, #6ab2f2);
    --red:   #e05a52;
    --gold:  #f5a623;
    --green: #4caf7d;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg2);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh}
  body{padding-bottom:80px}

  /* ── ШАПКА ── */
  .header{display:flex;align-items:center;gap:10px;padding:12px 16px 6px}
  .logo{width:40px;height:40px;border-radius:11px;flex-shrink:0;
    background:linear-gradient(135deg,#e0483f,#8b1f1b);
    display:flex;align-items:center;justify-content:center;font-size:20px}
  .hinfo{flex:1;min-width:0}
  .hinfo h1{font-size:16px;font-weight:700;line-height:1.2}
  .hinfo .sub{font-size:12px;color:var(--hint);margin-top:1px}
  .reserve-top{flex-shrink:0;border:none;background:var(--card);color:var(--text);
    border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer}
  .reserve-top:active{opacity:.7}

  /* ── ВКЛАДКИ ── */
  .tabs{display:flex;gap:0;padding:10px 12px 0;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{border:none;background:transparent;color:var(--hint);
    font-size:14px;font-weight:600;padding:7px 14px 10px;cursor:pointer;
    border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .tab:active{opacity:.7}

  /* ── ПОИСК ── */
  .searchbar{display:flex;gap:8px;padding:10px 12px;
    position:sticky;top:0;background:var(--bg2);z-index:10}
  .searchbar .wrap{position:relative;flex:1}
  .searchbar input{width:100%;border:none;outline:none;border-radius:12px;
    padding:11px 34px 11px 14px;font-size:15px;background:var(--card);color:var(--text)}
  .searchbar input::placeholder{color:var(--hint)}
  .clearbtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:26px;height:26px;border:none;border-radius:50%;background:transparent;
    color:var(--hint);font-size:16px;cursor:pointer;display:none}
  .gobtn{border:none;border-radius:12px;padding:0 18px;background:var(--btn);
    color:var(--btn-t);font-size:14px;font-weight:700;cursor:pointer}
  .gobtn:active{opacity:.8}

  /* ── СЕКЦИИ ── */
  .sec-title{font-size:12px;font-weight:700;letter-spacing:.07em;
    text-transform:uppercase;color:var(--hint);padding:8px 14px 6px}
  .status{text-align:center;font-size:13px;color:var(--hint);padding:6px 14px 10px}
  .status .pill{display:inline-block;background:var(--card);border-radius:14px;padding:6px 14px}

  /* ── ЖАНРЫ ── */
  .genres{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 4px}
  .genre{background:var(--card);border:none;border-radius:12px;
    padding:10px 12px;font-size:13.5px;color:var(--text);
    text-align:left;cursor:pointer;display:flex;align-items:center;gap:8px}
  .genre:active{opacity:.7}
  .genre .em{font-size:15px}
  .genre .cnt{color:var(--hint);font-size:12px;margin-left:auto}

  /* ── ЖАНР-ЭКРАН ── */
  .back-row{display:flex;align-items:center;gap:10px;padding:4px 12px 10px}
  .back-btn{border:none;background:var(--card);color:var(--text);
    border-radius:10px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer}
  .back-btn:active{opacity:.7}
  .gscreen-title{font-size:16px;font-weight:700}
  .gscreen-count{font-size:13px;color:var(--hint);margin-left:auto}
  .movie{background:var(--card);border-radius:12px;padding:10px 13px;
    display:flex;align-items:center;gap:10px;cursor:pointer}
  .movie:active{opacity:.7}
  .movie .mtitle{font-size:14px;line-height:1.3;flex:1}
  .movie .marrow{color:var(--hint);font-size:14px;flex-shrink:0}
  .movie.blocked .marrow{color:var(--red)}

  /* ── КАРТОЧКИ ПОСТОВ ── */
  .post{background:var(--card);border-radius:14px;padding:12px 14px;cursor:pointer}
  .post:active{opacity:.75}
  .post .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    font-size:12px;color:var(--hint);margin-bottom:6px}
  .post .score-tag{color:var(--accent);font-weight:700;margin-left:auto}
  .badge{font-size:11px;font-weight:700;border-radius:7px;padding:2px 7px}
  .badge.blocked{background:rgba(224,90,82,.15);color:var(--red)}
  .badge.low{background:rgba(112,132,153,.18);color:var(--hint)}
  .post .body{font-size:14.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .post .body mark{background:none;color:var(--accent);font-weight:700}
  .post .actions{display:flex;gap:14px;margin-top:8px}
  .post .actions span{font-size:13px;font-weight:600;color:var(--link)}
  .post .actions .to-reserve{color:var(--red)}

  /* ── ТОП ОЦЕНОК ── */
  .rating-card{background:var(--card);border-radius:14px;padding:12px 14px;cursor:pointer}
  .rating-card:active{opacity:.75}
  .rating-card .rtop{display:flex;align-items:center;gap:10px;margin-bottom:5px}
  .score-badge{
    width:46px;height:46px;border-radius:12px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:17px;font-weight:800;
  }
  .score-10{background:rgba(245,166,35,.18);color:var(--gold)}
  .score-9{background:rgba(76,175,125,.18);color:var(--green)}
  .score-8{background:rgba(106,179,243,.18);color:var(--accent)}
  .rating-card .rtitle{font-size:15px;font-weight:600;line-height:1.3}
  .rating-card .rquote{font-size:13px;color:var(--hint);line-height:1.4;margin-top:2px;
    font-style:italic}
  .rating-card .rmeta{font-size:12px;color:var(--hint);margin-top:6px}

  /* ── ПУСТОЕ СОСТОЯНИЕ ── */
  .empty{text-align:center;color:var(--hint);padding:36px 24px;font-size:14px;line-height:1.6}
  .empty .cta{display:inline-block;margin-top:12px;background:var(--card);
    color:var(--text);border-radius:12px;padding:9px 16px;font-size:13.5px;
    font-weight:600;cursor:pointer}

  /* ── КОНТЕЙНЕРЫ ── */
  .list{padding:0 12px;display:flex;flex-direction:column;gap:8px}
  .screen{display:none}
  .screen.active{display:block}

  /* ── ПОДВАЛ ── */
  .footer{text-align:center;color:var(--hint);font-size:12px;
    padding:22px 16px 6px;line-height:1.7}
  .footer a{color:var(--link);text-decoration:none}
  .hidden{display:none!important}
</style>
</head>
<body>

<div class="header">
  <div class="logo">🎬</div>
  <div class="hinfo">
    <h1>Зубарев смотрит</h1>
    <div class="sub">Поиск по записям канала</div>
  </div>
  <button class="reserve-top" id="reserveTop">📦 Резерв</button>
</div>

<!-- ВКЛАДКИ -->
<div class="tabs">
  <button class="tab active" data-tab="search">🔍 Поиск</button>
  <button class="tab" data-tab="genres">🎭 Жанры</button>
  <button class="tab" data-tab="top">⭐ Топ Зубарева</button>
  <button class="tab" data-tab="new">🆕 Новое</button>
</div>

<!-- ═══ ПОИСК ═══ -->
<div class="screen active" id="tab-search">
  <div class="searchbar">
    <div class="wrap">
      <input id="q" type="search" placeholder="Название, жанр или год…" autocomplete="off">
      <button class="clearbtn" id="clear">✕</button>
    </div>
    <button class="gobtn" id="go">Найти</button>
  </div>
  <div class="status" id="searchStatus"><span class="pill" id="searchText">Загружаю…</span></div>
  <div class="list" id="searchResults"></div>
  <div class="empty hidden" id="searchEmpty"></div>
  <div class="footer">
    Понимает опечатки, часть слова, транслит и ё/е.<br>
    <a id="helpLink" href="#">⚙️ Видео не работает — сюда</a>
  </div>
</div>

<!-- ═══ ЖАНРЫ ═══ -->
<div class="screen" id="tab-genres">
  <!-- главный список жанров -->
  <div id="genreHome">
    <div class="sec-title">Жанры и подборки</div>
    <div class="genres" id="genreGrid"></div>
  </div>
  <!-- экран конкретного жанра -->
  <div id="genreDetail" class="hidden">
    <div class="back-row">
      <button class="back-btn" id="genreBack">← Назад</button>
      <span class="gscreen-title" id="genreTitle"></span>
      <span class="gscreen-count" id="genreCount"></span>
    </div>
    <div class="list" id="genreMovies"></div>
  </div>
</div>

<!-- ═══ ТОП ЗУБАРЕВА ═══ -->
<div class="screen" id="tab-top">
  <div class="sec-title" id="topTitle">⭐ Лучшее по версии Зубарева</div>
  <div style="display:flex;gap:6px;padding:0 12px 10px;flex-wrap:wrap" id="topFilters">
    <button class="tab active" style="padding:5px 12px;border-radius:20px;border:1px solid var(--accent);font-size:13px" data-score="all">Все</button>
    <button class="tab" style="padding:5px 12px;border-radius:20px;border:1px solid var(--hint);font-size:13px" data-score="10">🏆 10/10</button>
    <button class="tab" style="padding:5px 12px;border-radius:20px;border:1px solid var(--hint);font-size:13px" data-score="9">⭐ 9/10</button>
    <button class="tab" style="padding:5px 12px;border-radius:20px;border:1px solid var(--hint);font-size:13px" data-score="8">👍 8/10</button>
  </div>
  <div class="list" id="topList"></div>
</div>

<!-- ═══ НОВОЕ ═══ -->
<div class="screen" id="tab-new">
  <div class="sec-title">Последние записи канала</div>
  <div class="status" id="newStatus"><span class="pill">Загружаю…</span></div>
  <div class="list" id="newList"></div>
</div>

<script>
(function(){
const CONFIG = {
  CHANNEL: 'zubareffflook',
  RESERVE_CHANNEL: 'rezervzub',
  HELP_URL: 'https://telegra.ph/Esli-u-vas-lagayutzavisayutne-rabotayut-07-02',
  BLOCKED: {
    98:  {url:'https://t.me/rezervzub',       date:'01.03.2026', title:'Гарри Поттер и Дары Смерти: Часть I'},
    139: {url:'https://t.me/rezervzub/33',    date:'02.08.2026', title:'Волк с Уолл-стрит'},
    502: {url:'https://t.me/rezervzub',       date:'23.02.2026', title:'Интерстеллар'},
    673: {url:'https://t.me/rezervzub/21',    date:'14.07.2026', title:'Дэдпул и Росомаха'},
    676: {url:'https://t.me/rezervzub/50',    date:'31.07.2026', title:'Один дома'},
    697: {url:'https://t.me/rezervzub/4',     date:'11.07.2026', title:'В поисках Немо'},
    752: {url:'https://t.me/rezervzub/17',    date:'18.07.2026', title:'Властелин колец: Две крепости'},
    759: {url:'https://t.me/rezervzub/46',    date:'28.07.2026', title:'Властелин колец: Возвращение короля'},
    806: {url:'https://t.me/rezervzub/37',    date:'22.07.2026', title:'Иллюзия обмана'},
    896: {url:'https://t.me/rezervzub/2',     date:'13.07.2026', title:'ВАЛЛ·И'},
    978: {url:'https://t.me/rezervzub/14',    date:'19.07.2026', title:'Джентльмены'},
   1016: {url:'https://t.me/rezervzub/30',    date:'13.04.2026', title:'Гренландия'},
   1036: {url:'https://t.me/rezervzub/53',    date:'04.08.2026', title:'Семья по-быстрому'},
   1143: {url:'https://t.me/rezervzub/43',    date:'30.07.2026', title:'Храбрая сердцем'},
   1201: {url:'https://t.me/rezervzub/7',     date:'14.07.2026', title:'Аватар: Путь воды'},
   1292: {url:'https://t.me/rezervzub',       date:'13.07.2026', title:'Мстители: Война бесконечности'},
   1398: {url:'https://t.me/rezervzub/12',    date:'13.07.2026', title:'Алиса в Зазеркалье'},
   1556: {url:'https://t.me/rezervzub/40',    date:'25.07.2026', title:'Годзилла 2: Король монстров'},
   1572: {url:'https://t.me/rezervzub/27',    date:'14.07.2026', title:'Хищник: Планета смерти'},
   1621: {url:'https://t.me/rezervzub/24',    date:'14.07.2026', title:'Райя и последний дракон'},
  }
};

const tg = window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}

function openLink(url){
  if(!url) return;
  if(tg && url.startsWith('https://t.me/') && tg.openTelegramLink) tg.openTelegramLink(url);
  else if(tg && tg.openLink) tg.openLink(url);
  else window.open(url,'_blank');
}

// ════ ДАННЫЕ ════
let POSTS=[], GENRES=[], RATINGS=[], INDEX=[];
const PAGE=5, PAGE_MORE=15;
let searchResults=[], searchShown=0, newShown=0, curTopFilter='all';

// ════ ПОИСКОВЫЙ ДВИЖОК ════
const RU2EN={"а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ж":"zh","з":"z","и":"i","й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"h","ц":"ts","ч":"ch","ш":"sh","щ":"sch","ъ":"","ы":"y","ь":"","э":"e","ю":"yu","я":"ya"};
const normalize=s=>(s||'').toLowerCase().replace(/ё/g,'е').replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
const translit=s=>{let o='';for(const c of s)o+=(RU2EN[c]!==undefined?RU2EN[c]:c);return o;};
function grams(s){const set=new Set(),p=' '+s+' ';for(let i=0;i<p.length-1;i++)set.add(p.slice(i,i+2));for(let i=0;i<p.length-2;i++)set.add(p.slice(i,i+3));return set;}
const tgc=new Map();
function tokGrams(t){let g=tgc.get(t);if(g)return g;g=new Set();const p=' '+t+' ';for(let i=0;i<p.length-1;i++)g.add(p.slice(i,i+2));tgc.set(t,g);return g;}
function dice(a,b){const ga=tokGrams(a),gb=tokGrams(b);let h=0;for(const x of ga)if(gb.has(x))h++;return 2*h/(ga.size+gb.size);}
const sc=new Map();
function skel(t){let s=sc.get(t);if(s!==undefined)return s;s=t.replace(/[аеиоуыэюяйьъaeiouy]/g,'').replace(/(.)\1+/g,'$1');sc.set(t,s);return s;}

function buildIndex(){
  INDEX=POSTS.map(p=>{
    const n=normalize(p.text),f=n+' '+translit(n);
    return{post:p,norm:f,tokens:f.split(' ').filter(Boolean),grams:grams(f)};
  });
}

function scoreEntry(e,qN,qT,qG){
  let s=0;
  if(qN.length>=2 && e.norm.includes(qN)) s+=100;
  for(const qt of qT){
    if(qt.length<2) continue;
    let b=0;
    for(const t of e.tokens){
      if(t===qt) b=Math.max(b,40);
      else if(t.startsWith(qt)) b=Math.max(b,25);
      else if(qt.length>=3&&t.includes(qt)) b=Math.max(b,15);
      else if(qt.length>=4&&Math.abs(t.length-qt.length)<=3){
        const d=dice(qt,t);
        if(d>=0.6) b=Math.max(b,d*35);
        else{const sq=skel(qt);if(sq.length>=3&&sq===skel(t))b=Math.max(b,22);}
      }
    }
    s+=b;
  }
  if(qG.size){let h=0;for(const g of qG)if(e.grams.has(g))h++;s+=(h/qG.size)*30;}
  if(e.tokens.length>150) s*=0.5;
  return s;
}

function search(query){
  const qn=normalize(query);
  if(!qn) return [];
  const qtr=translit(qn),qs=qn===qtr?[qn]:[qn,qtr];
  const out=[];
  for(const e of INDEX){
    let b=0;
    for(const q of qs){const st=scoreEntry(e,q,q.split(' ').filter(Boolean),grams(q));if(st>b)b=st;}
    if(b>=18) out.push({entry:e,s:b});
  }
  return out.sort((a,b)=>b.s-a.s||b.entry.post.id-a.entry.post.id);
}

// ════ УТИЛИТЫ РЕНДЕРА ════
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function highlight(text,q){
  let safe=esc(text);
  for(const w of normalize(q||'').split(' ').filter(w=>w.length>=2)){
    try{safe=safe.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');}catch(e){}
  }
  return safe;
}
function fmtDate(iso){
  if(!iso) return '';
  const d=new Date(iso);
  return isNaN(d)?iso:d.toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'});
}
function excerpt(text,q,max=300){
  if(text.length<=max) return text;
  const idx=normalize(text).indexOf(normalize(q||'').split(' ')[0]||'');
  if(idx<=60) return text.slice(0,max)+'…';
  return '…'+text.slice(Math.max(0,idx-60),idx-60+max)+'…';
}

// ════ КАРТОЧКА ПОСТА ════
function makePostCard(p,query,showScore,score){
  const isB=CONFIG.BLOCKED[p.id];
  const isLow=/#low\b/i.test(p.text);
  const div=document.createElement('div');
  div.className='post';
  let meta=`<span>${fmtDate(p.date)}</span>`;
  if(isB) meta+=`<span class="badge blocked">🚫 ${isB.date}</span>`;
  if(isLow) meta+=`<span class="badge low">low</span>`;
  if(showScore&&score!=null) meta+=`<span class="score-tag">${Math.min(100,Math.round(score))}%</span>`;
  let action=isB
    ?`<span class="to-reserve">📦 Открыть в резерве →</span>`
    :`<span>Открыть запись →</span>`;
  div.innerHTML=`<div class="meta">${meta}</div>`+
    `<div class="body">${highlight(excerpt(p.text,query),query)}</div>`+
    `<div class="actions">${action}</div>`;
  div.addEventListener('click',()=>{
    openLink(isB ? isB.url : `https://t.me/${CONFIG.CHANNEL}/${p.id}`);
  });
  return div;
}

// ════ ВКЛАДКА: ПОИСК ════
const $sResults=document.getElementById('searchResults');
const $sStatus=document.getElementById('searchStatus');
const $sText=document.getElementById('searchText');
const $sEmpty=document.getElementById('searchEmpty');
const $q=document.getElementById('q');
const $clear=document.getElementById('clear');

function renderSearchChunk(){
  const chunk=searchResults.slice(searchShown,searchShown+(searchShown===0?PAGE:PAGE_MORE));
  const frag=document.createDocumentFragment();
  for(const r of chunk) frag.appendChild(makePostCard(r.entry.post,$q.value.trim(),true,r.s));
  $sResults.appendChild(frag);
  searchShown+=chunk.length;
}

function runSearch(){
  const q=$q.value.trim();
  $clear.style.display=q?'block':'none';
  $sResults.innerHTML='';$sEmpty.classList.add('hidden');searchShown=0;
  if(!q){
    $sStatus.classList.remove('hidden');
    $sText.textContent=`В архиве: ${POSTS.length} записей. Введите запрос.`;
    return;
  }
  searchResults=search(q);
  if(!searchResults.length){
    $sStatus.classList.add('hidden');
    $sEmpty.innerHTML=`По запросу «${esc(q)}» ничего не найдено.<br>Попробуйте одно слово из названия.<br>Фильм мог попасть под блокировку.`+
      `<br><span class="cta" id="emptyRes">📦 Открыть Резерв</span>`;
    $sEmpty.classList.remove('hidden');
    document.getElementById('emptyRes')?.addEventListener('click',()=>openLink('https://t.me/'+CONFIG.RESERVE_CHANNEL));
    return;
  }
  $sStatus.classList.remove('hidden');
  $sText.textContent=`Найдено: ${searchResults.length}`;
  renderSearchChunk();
}

document.getElementById('go').addEventListener('click',runSearch);
$q.addEventListener('keydown',e=>{if(e.key==='Enter'){$q.blur();runSearch();}});
$q.addEventListener('input',()=>{$clear.style.display=$q.value?'block':'none';if(!$q.value.trim())runSearch();});
$clear.addEventListener('click',()=>{$q.value='';runSearch();});

// ════ ВКЛАДКА: ЖАНРЫ ════
const $genreGrid=document.getElementById('genreGrid');
const $genreHome=document.getElementById('genreHome');
const $genreDetail=document.getElementById('genreDetail');
const $genreMovies=document.getElementById('genreMovies');

function buildGenreGrid(){
  $genreGrid.innerHTML='';
  for(const g of GENRES){
    const b=document.createElement('button');
    b.className='genre';
    b.innerHTML=`<span class="em">${g.em}</span><span>${g.name}</span>`+
      (g.items.length?`<span class="cnt">${g.items.length}</span>`:'');
    b.addEventListener('click',()=>showGenre(g));
    $genreGrid.appendChild(b);
  }
}

function showGenre(g){
  if(!g.items.length&&g.cat){openLink(`https://t.me/${CONFIG.CHANNEL}/${g.cat}`);return;}
  $genreHome.classList.add('hidden');
  $genreDetail.classList.remove('hidden');
  document.getElementById('genreTitle').textContent=g.em+' '+g.name;
  document.getElementById('genreCount').textContent=g.items.length+' шт';
  $genreMovies.innerHTML='';
  const frag=document.createDocumentFragment();
  for(const item of g.items){
    const isB=item.b;
    const div=document.createElement('div');
    div.className='movie'+(isB?' blocked':'');
    let badge=isB?`<span class="badge blocked" style="margin-left:6px">🚫</span>`:
      (!item.id?`<span class="badge low" style="margin-left:6px">поиск</span>`:'');
    div.innerHTML=`<div class="mtitle">${esc(item.t)}${badge}</div>`+
      `<span class="marrow">${isB?'📦':'→'}</span>`;
    div.addEventListener('click',()=>{
      if(isB){
        // ищем прямую ссылку в BLOCKED по title
        const bEntry=Object.values(CONFIG.BLOCKED).find(b=>item.t.includes(b.title)||b.title.includes(item.t.replace(/\s*\(\d{4}\)/,'')));
        openLink(bEntry?bEntry.url:'https://t.me/'+CONFIG.RESERVE_CHANNEL);
      } else if(item.id){
        openLink(`https://t.me/${CONFIG.CHANNEL}/${item.id}`);
      } else {
        $q.value=item.t.replace(/\s*\(\d{4}\)\s*$/,'');
        switchTab('search');runSearch();window.scrollTo(0,0);
      }
    });
    frag.appendChild(div);
  }
  $genreMovies.appendChild(frag);
  if(tg?.BackButton){tg.BackButton.show();}
}

function backToGenres(){
  $genreDetail.classList.add('hidden');
  $genreHome.classList.remove('hidden');
  if(tg?.BackButton) tg.BackButton.hide();
}
document.getElementById('genreBack').addEventListener('click',backToGenres);
if(tg?.BackButton) tg.BackButton.onClick(backToGenres);

// ════ ВКЛАДКА: ТОП ЗУБАРЕВА ════
const $topList=document.getElementById('topList');

function buildTop(filter){
  curTopFilter=filter;
  $topList.innerHTML='';
  let data=RATINGS.filter(r=>r.score!=null&&r.score>=8);
  if(filter==='10') data=data.filter(r=>r.score>=10);
  else if(filter==='9') data=data.filter(r=>r.score>=9&&r.score<10);
  else if(filter==='8') data=data.filter(r=>r.score>=8&&r.score<9);
  data=data.sort((a,b)=>b.score-a.score||b.id-a.id);
  const frag=document.createDocumentFragment();
  for(const r of data){
    const sc=r.score>=10?'score-10':r.score>=9?'score-9':'score-8';
    const isB=CONFIG.BLOCKED[r.id];
    const div=document.createElement('div');
    div.className='rating-card';
    div.innerHTML=`<div class="rtop">`+
      `<div class="score-badge ${sc}">${r.score}</div>`+
      `<div><div class="rtitle">${esc(r.title)}</div>`+
      (r.raw?`<div class="rquote">«${esc(r.raw.slice(0,90))}»</div>`:'')+'</div></div>'+
      `<div class="rmeta">${r.date}${isB?' · <span style="color:var(--red)">🚫 в резерве</span>':''}</div>`;
    div.addEventListener('click',()=>{
      if(isB) openLink(isB.url);
      else openLink(`https://t.me/${CONFIG.CHANNEL}/${r.id}`);
    });
    frag.appendChild(div);
  }
  $topList.appendChild(frag);
  document.getElementById('topTitle').textContent=`⭐ Лучшее по версии Зубарева (${data.length} фильмов)`;
}

document.getElementById('topFilters').addEventListener('click',e=>{
  const btn=e.target.closest('[data-score]');
  if(!btn) return;
  document.querySelectorAll('#topFilters [data-score]').forEach(b=>{
    b.style.borderColor='var(--hint)';b.classList.remove('active');});
  btn.style.borderColor='var(--accent)';btn.classList.add('active');
  buildTop(btn.dataset.score);
});

// ════ ВКЛАДКА: НОВОЕ ════
const $newList=document.getElementById('newList');
let newPosts=[];

function buildNew(){
  newPosts=INDEX.slice().sort((a,b)=>b.post.id-a.post.id);
  document.getElementById('newStatus').innerHTML='<span class="pill">Последние '+Math.min(newPosts.length,50)+' записей</span>';
  renderNewChunk();
}
function renderNewChunk(){
  const chunk=newPosts.slice(newShown,newShown+(newShown===0?PAGE:PAGE_MORE));
  const frag=document.createDocumentFragment();
  for(const e of chunk) frag.appendChild(makePostCard(e.post,'',false,null));
  $newList.appendChild(frag);
  newShown+=chunk.length;
}

// ════ ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ════
function switchTab(name){
  document.querySelectorAll('.tab[data-tab]').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id==='tab-'+name));
  // сбрасываем жанр-экран при переключении
  if(name!=='genres'){$genreDetail.classList.add('hidden');$genreHome.classList.remove('hidden');}
  window.scrollTo(0,0);
}
document.querySelectorAll('.tab[data-tab]').forEach(t=>{
  t.addEventListener('click',()=>switchTab(t.dataset.tab));
});

// ════ ИНФРАСТРУКТУРА ════
document.getElementById('reserveTop').addEventListener('click',()=>openLink('https://t.me/'+CONFIG.RESERVE_CHANNEL));
document.getElementById('helpLink').addEventListener('click',e=>{e.preventDefault();openLink(CONFIG.HELP_URL);});

// подгрузка при скролле
window.addEventListener('scroll',()=>{
  if(window.innerHeight+window.scrollY<document.body.offsetHeight-250) return;
  const active=document.querySelector('.screen.active')?.id;
  if(active==='tab-search'&&searchShown<searchResults.length) renderSearchChunk();
  if(active==='tab-new'&&newShown<newPosts.length) renderNewChunk();
});

// ════ ЗАГРУЗКА ДАННЫХ ════
Promise.all([
  fetch('posts.json',{cache:'no-store'}).then(r=>r.json()),
  fetch('genres.json',{cache:'no-store'}).then(r=>r.ok?r.json():[]).catch(()=>[]),
  fetch('ratings.json',{cache:'no-store'}).then(r=>r.ok?r.json():[]).catch(()=>[]),
]).then(([posts,genres,ratings])=>{
  POSTS=posts.filter(p=>!p.text.includes('lvlx.click'));
  GENRES=genres;
  RATINGS=ratings;
}).catch(()=>{
  POSTS=[{id:1,date:'',text:'Не удалось загрузить posts.json'}];
}).finally(()=>{
  buildIndex();
  buildGenreGrid();
  buildTop('all');
  buildNew();
  $sText.textContent=`В архиве: ${POSTS.length} записей. Введите запрос.`;
});

})();
</script>
</body>
</html>
